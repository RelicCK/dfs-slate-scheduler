<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dupe Checker</title>
<style>
/* same tokens and controls as the Slate Locks page (index.html) */
:root{--bg:#f6f7f9;--card:#fff;--ink:#16181d;--muted:#667085;--line:#e3e6eb;--accent:#2f6fed;--dk:#53a318;--fd:#1493ff;--warn:#c4320a;--soft:#eef3ff;--amber:#f5a524;--good:#2e8540}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--ink:#e8eaee;--muted:#98a2b3;--line:#2a2f38;--accent:#6f9bff;--soft:#1d2433;--warn:#ff8a65;--good:#6fd08c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:14px 16px 60px}
h1{font-size:22px;margin:0}
h3{font-size:15px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;min-width:0}
.hdr{position:sticky;top:0;z-index:20;background:var(--bg);margin:-14px -16px 12px;padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
/* app tabs: identical on every page */
.apptabs{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--card);flex:none}
.apptabs a{font-size:15px;font-weight:600;padding:5px 12px;border-radius:7px;color:var(--muted);text-decoration:none;white-space:nowrap;line-height:1.3}
.apptabs a:hover{color:var(--ink)}
.apptabs a.on{background:var(--accent);color:#fff}
@media (max-width:420px){.apptabs a{font-size:14px;padding:5px 8px}}
@media (min-width:1000px){main{max-width:none;padding:14px 24px 60px}.hdr{margin:-14px -24px 12px;padding:12px 24px 8px}}
.statusline{margin:4px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;text-decoration:none;display:inline-block;line-height:1.3}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.45;cursor:default}
button.sm{padding:4px 9px;font-size:13px}
input[type=text],input[type=number],select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
input.sm,select.sm{font-size:13px;padding:4px 6px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
label.f input,label.f select{width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.warn{color:var(--warn)}.good{color:var(--good)}.amber{color:#b7791f}
@media (prefers-color-scheme:dark){.amber{color:var(--amber)}}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;color:#fff;white-space:nowrap}
.pill.DK{background:var(--dk)}.pill.FD{background:var(--fd)}
.pill.type{background:var(--soft);color:var(--ink)}
.pill.uniq{background:color-mix(in srgb,var(--dk) 20%,transparent);color:var(--good)}
.pill.dup{background:color-mix(in srgb,var(--amber) 22%,transparent);color:var(--ink)}
.pill.me{background:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button,.seg a{border:none;border-radius:0;padding:5px 10px;font-size:13px;background:var(--card);color:var(--ink);text-decoration:none}
.seg .on{background:var(--accent);color:#fff}
/* inputs card */
.inputs{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.4fr);gap:14px}
.tracked{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.upl{display:flex;align-items:center;gap:8px;min-width:0;border:1px dashed var(--line);border-radius:10px;padding:7px 9px;margin-bottom:6px}
.upl.ok{border-style:solid;border-color:color-mix(in srgb,var(--dk) 55%,var(--line))}
.upl .fn{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upl b{font-size:13px;flex:none}
.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.meta .w2{grid-column:span 2}
body.over main{outline:3px dashed var(--accent);outline-offset:-6px}
.msg{font-size:13px;margin-top:6px}
.msg:empty{display:none}
/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;margin:0 0 12px;padding-bottom:2px}
.tabs button{white-space:nowrap;flex:none;font-size:13.5px;padding:6px 11px}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
.tile b{display:block;font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile span{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
/* tables */
.tw{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.tw.free{max-height:none}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:0;z-index:1;background:var(--card);font-size:12px;color:var(--muted);font-weight:600;border-top:none;box-shadow:inset 0 -1px 0 var(--line);white-space:nowrap}
th[data-sort]{cursor:pointer}th[data-sort]:hover{color:var(--ink)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.nw{white-space:nowrap}
tr.mine td{background:color-mix(in srgb,var(--accent) 9%,transparent)}
tr.sub td{background:var(--soft)}
td.fx{min-width:220px}
.pos{color:var(--good)}.neg{color:var(--warn)}
.cmpw{display:inline-block;max-width:100%}
table.cmp{table-layout:fixed}table.cmp td{border-top:none;padding:5px 10px;vertical-align:middle}
table.cmp th{padding:6px 10px;vertical-align:bottom}
table.cmp .st{position:sticky;left:0;z-index:2;background:var(--card);overflow:hidden;text-overflow:ellipsis}
table.cmp th.st{z-index:3}
table.cmp th.cv{text-align:center;border-left:1px solid var(--line);overflow:hidden;text-overflow:ellipsis}table.cmp th .sub{display:block;font-weight:400;font-size:10.5px;opacity:.8}
table.cmp td.me,table.cmp th.me{background:var(--soft);font-weight:700;text-align:right}table.cmp th.me{color:var(--ink)}
table.cmp td.cv{border-left:1px solid var(--line);text-align:right;padding:5px 6px 5px 10px}
table.cmp td.dv{font-size:12px;text-align:left;white-space:nowrap;padding:5px 10px 5px 4px;font-variant-numeric:tabular-nums;overflow:hidden}
table.cmp td.dv.z{color:var(--muted)}
table.cmp input.sm{width:100%;box-sizing:border-box;text-align:right}
table.cmp tr.z td{background:color-mix(in srgb,var(--line) 35%,var(--card))}table.cmp tr.z td.me{background:color-mix(in srgb,var(--line) 35%,var(--soft))}
table.cmp tbody tr:not(.sec):hover td{background:color-mix(in srgb,var(--accent) 14%,var(--card))}
table.cmp tr.sec td{background:var(--bg);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 10px 4px;border-top:1px solid var(--line)}
@media (max-width:600px){table.cmp .st{white-space:normal}}
.note{font-size:12px;color:var(--muted);margin-top:6px}
.empty{padding:18px;text-align:center;color:var(--muted)}
/* bars */
.bar{display:grid;grid-template-columns:70px minmax(0,1fr) 110px;gap:8px;align-items:center;font-size:12.5px;margin:3px 0}
.bar .t{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}
/* scatter */
.scat{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
/* sets */
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.slot{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:5px;min-width:0;background:var(--card)}
.slot.ok{border-color:color-mix(in srgb,var(--dk) 55%,var(--line))}
.slot .fn{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:5px}
details.exp>summary{cursor:pointer;color:var(--muted);font-size:13px}
.hist-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding:8px 0}
.hist-item:first-child{border-top:none}
.chips{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.altc{border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin:6px 0;font-size:13px}
.ovl td,.ovl th{text-align:center;white-space:nowrap}
.ovl td:first-child,.ovl th:first-child{text-align:left}
.kbd{font-family:ui-monospace,Menlo,monospace;font-size:12px}
@media (max-width:1100px){.inputs{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.inputs .c1{grid-column:1/-1}.slots{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.inputs{grid-template-columns:minmax(0,1fr)}.grid2{grid-template-columns:minmax(0,1fr)}.tracked{grid-template-columns:repeat(2,minmax(0,1fr))}.meta{grid-template-columns:repeat(2,minmax(0,1fr))}.tile b{font-size:17px}.bar{grid-template-columns:56px minmax(0,1fr) 96px}main{padding:14px 16px 60px}}
</style>
</head>
<body>
<main>
  <header class="hdr">
    <div class="top">
      <nav class="apptabs" aria-label="Pages"><a href="./">Slate Locks</a><a href="analytics.html" class="on" aria-current="page">Dupe Checker</a><a href="bankroll.html">Bankroll</a></nav>
    </div>
    <div class="small muted statusline" id="status">Add a contest standings file, or open History.</div>
  </header>

  <section class="card inputs" id="inputs">
    <div class="c1">
      <h3>Tracked players <span class="muted tiny" style="font-weight:400">DraftKings usernames, saved in this browser</span></h3>
      <div class="tracked" id="tracked"></div>
    </div>
    <div>
      <h3>Files <span class="muted tiny" style="font-weight:400">or drop them anywhere</span></h3>
      <div class="upl" id="uStd"><b>Standings</b><span class="fn muted">CSV or ZIP from DraftKings</span><button class="sm" data-pick="std">Choose</button></div>
      <div class="upl" id="uProj"><b>Projections</b><span class="fn muted">Name, DFS ID, FLEX/CPT Proj, Own</span><button class="sm" data-pick="proj">Choose</button></div>
      <div class="row"><button class="sm" data-tab="sets">Lineup sets (up to 10) →</button><button class="sm" id="clearAll">Clear</button></div>
      <input type="file" id="fStd" accept=".csv,.zip,text/csv,application/zip" hidden>
      <input type="file" id="fProj" accept=".csv,text/csv" hidden>
      <input type="file" id="fAny" accept=".csv,.zip" multiple hidden>
    </div>
    <div>
      <h3>Contest</h3>
      <div class="meta">
        <label class="f">Site<select id="mSite"><option>DK</option><option>FD</option></select></label>
        <label class="f">Sport<input type="text" id="mSport" placeholder="NFL"></label>
        <label class="f w2">Date<input type="text" id="mDate" placeholder="YYYY-MM-DD"></label>
        <label class="f w2">Contest name<input type="text" id="mName" placeholder="optional"></label>
        <label class="f w2">Contest ID<input type="text" id="mId" placeholder="from file name"></label>
        <label class="f">Entry fee $<input type="number" id="mFee" min="0" step="any" placeholder="needed for ROI"></label>
        <label class="f">Prize pool $<input type="number" id="mPool" min="0" step="any" placeholder="if known"></label>
        <label class="f">Rake % <input type="number" id="mRake" min="0" max="50" step="any" placeholder="13"></label>
        <div style="display:flex;align-items:flex-end"><button class="primary" id="saveBtn" disabled style="width:100%">Save to history</button></div>
      </div>
      <div class="note" id="payNote"></div>
    </div>
    <div class="msg" id="msg" style="grid-column:1/-1"></div>
  </section>

  <nav class="tabs" id="tabs">
    <button data-tab="overview">Overview</button><button data-tab="mine">My Lineups</button><button data-tab="players">Players</button>
    <button data-tab="explorer">Lineup Explorer</button><button data-tab="tradeoff">Projection vs Uniqueness</button><button data-tab="projections">Projections</button>
    <button data-tab="sets">Lineup Sets</button><button data-tab="compare">Player Comparison</button><button data-tab="history">History</button>
  </nav>
  <div id="view"></div>
</main>

<script src="js/dupe-core.js"></script>
<script src="js/dupe-db.js"></script>
<script src="js/analytics-ui.js"></script>
</body>
</html>
