<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slate Lock Schedule</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16181d;--muted:#667085;--line:#e3e6eb;--accent:#2f6fed;--dk:#53a318;--fd:#1493ff;--warn:#c4320a;--soft:#eef3ff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--ink:#e8eaee;--muted:#98a2b3;--line:#2a2f38;--accent:#6f9bff;--soft:#1d2433;--warn:#ff8a65}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top h1{margin:0}
#gear{font-size:18px;line-height:1;padding:6px 10px}
#gear.on{background:var(--soft)}
.statusline{margin:6px 0 12px}
.statusline span{display:block}
body.over main{outline:3px dashed var(--accent);outline-offset:-6px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
input[type=text],input[type=number],input[type=time]{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;color:#fff}
.pill.DK{background:var(--dk)}.pill.FD{background:var(--fd)}
.pill.type{background:var(--soft);color:var(--ink)}
table{width:100%;border-collapse:collapse;margin-top:8px}
td,th{padding:6px 4px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;border-top:none}
td.t{white-space:nowrap;font-variant-numeric:tabular-nums;width:1%}
.past{opacity:.45}
.next td{background:var(--soft)}
.tag{font-size:12px;font-weight:600}
.tag.first{color:var(--warn)}
.warn{color:var(--warn)}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
#log{white-space:pre-wrap;font-size:13px;color:var(--muted);margin-top:8px}
.slate-h{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:5px 10px;font-size:13px}
.seg button.on{background:var(--accent);color:#fff}
.dnav{display:flex;align-items:center;justify-content:space-between;margin:10px 0 6px}
.dnav button{padding:4px 12px}
.gantt{position:relative;margin-top:4px}
.gaxis{position:relative;height:18px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line)}
.gaxis span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.grow{position:relative;padding:6px 0 4px;border-bottom:1px solid var(--line)}
.glabel{font-size:13px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gtrack{position:relative;height:36px}
.gtime{position:absolute;top:21px;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}
.ggrid{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.gbar{position:absolute;top:7px;height:8px;border-radius:4px;opacity:.55}
.gbar.DK{background:var(--dk)}.gbar.FD{background:var(--fd)}
.gbar.cont{border-top-left-radius:0;border-bottom-left-radius:0}
.gtick{position:absolute;top:3px;width:16px;height:16px;margin-left:-8px;border-radius:50%;border:2px solid var(--card);background:var(--ink)}
.gtick.first{background:var(--warn)}
.gtick.past{opacity:.4}
.gnow{position:absolute;top:0;bottom:0;width:2px;background:var(--warn);z-index:2}
.grow:first-child .gnow::before{content:'now';position:absolute;top:-2px;left:4px;font-size:10px;color:var(--warn)}
.legend{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.x{border:none;background:none;color:var(--muted);padding:2px 6px}
/* wide screens: use the width, two columns, one-line day-view rows */
@media (min-width:1000px){
  main{max-width:1500px;padding:16px 24px}
  .layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
  #timelineCard{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;margin:0}
  #slates{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
  #slates .card{margin:0}
  #settings{max-width:900px}
  .grow,.gaxrow{display:grid;grid-template-columns:270px minmax(0,1fr);align-items:center;gap:10px}
  .grow{padding:2px 0}
  .glabel{margin:0;font-size:12.5px}
  .gtrack{height:32px}
  .gtime{top:19px}
  .gtick{top:2px;width:14px;height:14px;margin-left:-7px}
  .gbar{top:5px}
}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Slate Locks</h1>
    <div class="row">
      <button class="primary" id="addFiles">+ Add files</button>
      <button id="gear" title="Settings" aria-label="Settings">⚙</button>
    </div>
  </div>
  <input type="file" id="file" accept=".csv,text/csv" multiple hidden>
  <div class="small muted statusline"><span id="syncStatus">Sync: enter your ntfy topic in settings.</span> <span id="lastLog"></span></div>

  <div class="card" id="settings" hidden>
    <div class="row">
      <label>ntfy topic <input type="text" id="topic" placeholder="your-secret-topic" size="18"></label>
      <label>Alert <input type="number" id="lead" min="1" max="180" value="25" style="width:64px"> min before</label>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="primary" id="schedule">Schedule alerts</button>
      <button id="test">Send test</button>
      <button id="syncNow">Sync now</button>
      <button id="clear">Clear slates</button>
    </div>
    <div class="small muted" style="margin-top:8px">Add your DK and FD entry CSVs with the button above, or drag them anywhere onto the page. All times Eastern.</div>
    <div id="log"></div>
  </div>

  <div class="layout">
  <div class="card" id="timelineCard" hidden>
    <div class="slate-h"><div><strong>Upcoming locks</strong> <span class="muted small" id="countdown"></span></div>
      <div class="seg"><button id="vList" class="on">List</button><button id="vDay">Day view</button></div></div>
    <table id="timeline"></table>
    <div id="dayview" hidden></div>
  </div>

  <div id="slates"></div>
  </div>
</main>

<script>
const TZ = 'America/New_York';
const LS = {get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
            set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

// ---------- time helpers ----------
function etParts(date){
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(date).map(x=>[x.type,x.value]));
  return {y:+p.year,m:+p.month,d:+p.day,h:+p.hour,mi:+p.minute};
}
// Eastern wall-clock -> epoch ms
function etToMs(y,m,d,h,mi){
  let guess = Date.UTC(y,m-1,d,h+5,mi);
  for(let i=0;i<3;i++){
    const p = etParts(new Date(guess));
    const diff = Date.UTC(y,m-1,d,h,mi) - Date.UTC(p.y,p.m-1,p.d,p.h,p.mi);
    if(!diff) break; guess += diff;
  }
  return guess;
}
const fmtTime = ms => new Date(ms).toLocaleTimeString('en-US',{timeZone:TZ,hour:'numeric',minute:'2-digit'});
const fmtDay = ms => new Date(ms).toLocaleDateString('en-US',{timeZone:TZ,weekday:'short',month:'short',day:'numeric'});
const etDateKey = ms => {const p=etParts(new Date(ms));return `${p.y}-${String(p.m).padStart(2,'0')}-${String(p.d).padStart(2,'0')}`};
const todayKey = () => etDateKey(Date.now());

// ---------- CSV ----------
function parseCSV(text){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c=='"'){ if(text[i+1]=='"'){f+='"';i++} else q=false } else f+=c; }
    else if(c=='"') q=true;
    else if(c==','){row.push(f);f=''}
    else if(c=='\n'||c=='\r'){ if(c=='\r'&&text[i+1]=='\n') i++; row.push(f);rows.push(row);row=[];f=''; }
    else f+=c;
  }
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows;
}

// ---------- team normalization ----------
const ALIAS = {WSH:'WAS',UTAH:'UTA',UTH:'UTA',PHX:'PHO',GSW:'GS',NYK:'NY',NOP:'NO',NOR:'NO',SAS:'SA',BRK:'BKN',BKN:'BKN',
  CHW:'CWS',CHA:'CHA',KCR:'KC',SDP:'SD',SFG:'SF',TBR:'TB',TBL:'TB',WSN:'WAS',WAS:'WAS',LAK:'LA',NJD:'NJ',SJS:'SJ',
  MTL:'MON',VGK:'VEG',VGS:'VEG',CLB:'CBJ',JAC:'JAX',LA:'LA',ARZ:'ARI',AZ:'ARI',CHI:'CHI',UTAH_HC:'UTA'};
const norm = t => { t=(t||'').toUpperCase().replace(/[^A-Z0-9]/g,''); return ALIAS[t]||t; };

const SPORTS = ['NFL','NBA','NHL','MLB','WNBA','CFB','CBB','NCAAF','NCAAB','PGA','GOLF','MMA','NAS','NASCAR','SOC','EPL','MLS','LOL','CS','TEN','F1','CFL','XFL','UFL'];
const ESPN = {NFL:'football/nfl',NBA:'basketball/nba',NHL:'hockey/nhl',MLB:'baseball/mlb',WNBA:'basketball/wnba',
  CFB:'football/college-football?groups=80',NCAAF:'football/college-football?groups=80',
  CBB:'basketball/mens-college-basketball?groups=50',NCAAB:'basketball/mens-college-basketball?groups=50',
  EPL:'soccer/eng.1',MLS:'soccer/usa.1',UFL:'football/ufl',CFL:'football/cfl'};
function sportFrom(name){
  const up=(name||'').toUpperCase();
  for(const s of SPORTS) if(new RegExp('\\b'+s+'\\b').test(up)) return s;
  return '?';
}

// ---------- state ----------
let slates = LS.get('slates', {});   // key -> slate
let manual = LS.get('manualTimes', {}); // gameKey -> ms
// older saves: DK games with no time and no matchup were already-played games
for(const sl of Object.values(slates)) if(sl.site=='DK') for(const g of sl.games) if(!g.ms && !g.started && !/@/.test(g.label)) g.started=true;

function save(){ LS.set('slates', slates); LS.set('manualTimes', manual); }
function prune(){
  const cutoff = Date.now() - 12*3600e3;
  for(const [k,s] of Object.entries(slates)){
    const times = s.games.filter(g=>!g.started).map(g=>g.ms).filter(Boolean);
    const unresolved = s.games.some(g=>!g.ms && !g.started);
    const last = times.length ? Math.max(...times) : 0;
    if(unresolved ? (s.addedAt||0) < Date.now()-7*86400e3 : last < cutoff) delete slates[k];
  }
}

// ---------- parsers ----------
function parseDK(rows, fname){
  const h = rows[0];
  const iId=h.indexOf('Entry ID'), iName=h.indexOf('Contest Name'), iCid=h.indexOf('Contest ID'), iFee=h.indexOf('Entry Fee');
  let posEnd = h.indexOf('', iFee+1); if(posEnd<0) posEnd=h.length;
  const positions = h.slice(iFee+1, posEnd);
  const contests = {};
  for(const r of rows.slice(1)){
    if(!r[iId] || !/^\d+$/.test(r[iId].trim())) continue;
    const c = contests[r[iCid]] ||= {id:r[iCid], name:r[iName], fee:r[iFee], entries:0};
    c.entries++;
  }
  // player pool
  let gi=-1, hdrRow=-1;
  rows.forEach((r,ri)=>{ if(gi<0){ const j=r.indexOf('Game Info'); if(j>=0){gi=j;hdrRow=ri} } });
  const ti = hdrRow>=0 ? rows[hdrRow].indexOf('TeamAbbrev') : -1;
  const games = {};
  if(gi>=0) for(const r of rows.slice(hdrRow+1)){
    const v=(r[gi]||'').trim(); if(!v) continue;
    const m = v.match(/^(.*?)\s*(\d{2})\/(\d{2})\/(\d{4})\s+(\d{1,2}):(\d{2})\s*(AM|PM)/i);
    if(!m) { games['started|'+v] ||= {label:v, ms:null, started:true, count:0}; games['started|'+v].count++;
      if(ti>=0 && r[ti]) (games['started|'+v].teams ||= []).includes(r[ti]) || games['started|'+v].teams.push(r[ti]);
      continue; }
    let label=m[1].trim(); let hr=+m[5]%12; if(m[7].toUpperCase()=='PM') hr+=12;
    const ms = etToMs(+m[4],+m[2],+m[3],hr,+m[6]);
    const key = label+'|'+ms;
    if(!games[key]){
      const [a,b] = label.includes('@') ? label.split('@') : [label,''];
      games[key] = {label, away:a, home:b, ms, src:'DK file'};
    }
  }
  const cl = Object.values(contests);
  const sport = sportFrom(cl.map(c=>c.name).join(' '));
  const type = positions.includes('CPT') ? 'Showdown' : (positions.some(p=>/^(TIER|T\d)/i.test(p)) ? 'Tiers' : 'Classic');
  const gl = Object.values(games).sort((a,b)=>(a.ms||0)-(b.ms||0));
  const key = 'DK|'+sport+'|'+type+'|'+gl.map(g=>g.label+'@'+g.ms).join(',');
  return {key, site:'DK', sport, type, contests:cl, games:gl, positions, date: gl[0]?.ms ? etDateKey(gl[0].ms) : todayKey()};
}

function parseFD(rows, fname){
  const h = rows[0];
  const iId=h.indexOf('entry_id'), iCid=h.indexOf('contest_id'), iName=h.indexOf('contest_name'), iFee=h.indexOf('entry_fee');
  let posEnd = h.indexOf('', iFee+1); if(posEnd<0) posEnd=h.length;
  const positions = h.slice(iFee+1,posEnd);
  const contests = {}; let slateId='';
  for(const r of rows.slice(1)){
    if(!r[iId] || !/^\d+$/.test(r[iId].trim())) continue;
    slateId ||= (r[iCid]||'').split('-')[0];
    const c = contests[r[iCid]] ||= {id:r[iCid], name:r[iName], fee:'$'+r[iFee], entries:0};
    c.entries++;
  }
  let gi=-1, hdrRow=-1;
  rows.forEach((r,ri)=>{ if(gi<0){ const idx=r.findIndex((x,j)=>x==='Game' && r[j+1]!==undefined && r.includes('Salary')); if(idx>=0){gi=idx;hdrRow=ri} } });
  const games = {};
  if(gi>=0) for(const r of rows.slice(hdrRow+1)){
    const v=(r[gi]||'').trim(); if(!v || games[v]) continue;
    const [a,b] = v.includes('@') ? v.split('@') : [v,''];
    games[v] = {label:v, away:a, home:b, ms:null};
  }
  const fm = (fname||'').match(/FanDuel-([A-Z0-9]+)-(\d{4}-\d{2}-\d{2})-(\d+)/i);
  const cl = Object.values(contests);
  const sport = fm ? fm[1].toUpperCase() : sportFrom(cl.map(c=>c.name).join(' '));
  const date = fm ? fm[2] : todayKey();
  slateId ||= fm ? fm[3] : String(Date.now());
  const type = positions.some(p=>/MVP|CAPTAIN|STAR|PRO/i.test(p)) ? 'Single game' : 'Classic';
  return {key:'FD|'+slateId, site:'FD', sport, type, contests:cl, games:Object.values(games), positions, date, slateId};
}

// ---------- FanDuel start-time lookup ----------
const espnCache = {};
function addDays(date, n){ const [y,m,d]=date.split('-').map(Number); const t=new Date(Date.UTC(y,m-1,d+n)); return t.toISOString().slice(0,10); }
async function espnDay(league, extra, day){
  const k = league+day; if(espnCache[k]) return espnCache[k];
  const url = `https://site.api.espn.com/apis/site/v2/sports/${league}/scoreboard?${extra?extra+'&':''}dates=${day.replace(/-/g,'')}&limit=500`;
  try{
    const j = await (await fetch(url)).json();
    espnCache[k] = (j.events||[]).map(e=>{
      const comp=e.competitions?.[0]; const t=comp?.competitors||[];
      const away=t.find(x=>x.homeAway=='away')?.team?.abbreviation, home=t.find(x=>x.homeAway=='home')?.team?.abbreviation;
      return {away, home, ms:Date.parse(comp?.date||e.date)};
    });
  }catch(e){ log(`Could not reach ESPN for ${league} ${day}: ${e.message}`); return []; }
  return espnCache[k];
}
// Slates can span several days (e.g. NFL Mon-Thu), so fetch each day from the slate date forward
async function espnGames(sport, date){
  const path = ESPN[sport]; if(!path) return [];
  const [league, extra] = path.split('?');
  const span = /football/.test(league) ? 6 : 1;
  const days = Array.from({length:span+1}, (_,i)=>addDays(date,i));
  return (await Promise.all(days.map(d=>espnDay(league, extra, d)))).flat();
}
function matchGame(g, pool){
  const a=norm(g.away), h=norm(g.home);
  pool = [...pool].sort((x,y)=>x.ms-y.ms);
  let m = pool.find(x=>norm(x.away)==a && norm(x.home)==h);
  if(!m) { const c = pool.filter(x=>[norm(x.away),norm(x.home)].some(t=>t==a||t==h)); if(c.length==1) m=c[0]; }
  return m;
}
async function resolveFD(s){
  const startMs = etToMs(...s.date.split('-').map(Number), 0, 0), endMs = startMs + 7*86400e3;
  const dkPool = Object.values(slates).filter(x=>x.site=='DK' && x.sport==s.sport).flatMap(x=>x.games.filter(g=>g.ms && g.ms>=startMs && g.ms<endMs));
  for(const g of s.games){
    const mk = s.key+'|'+g.label;
    if(manual[mk]){ g.ms=manual[mk]; g.src='entered'; continue; }
    if(g.ms && g.src) continue;
    const m = matchGame(g, dkPool);
    if(m){ g.ms=m.ms; g.src='DK file'; continue; }
  }
  if(s.games.some(g=>!g.ms)){
    const pool = await espnGames(s.sport, s.date);
    for(const g of s.games) if(!g.ms){ const m=matchGame(g,pool); if(m){g.ms=m.ms; g.src='ESPN'} }
  }
  s.games.sort((a,b)=>(a.ms||9e15)-(b.ms||9e15));
}

// ---------- files ----------
async function handleFiles(files){
  for(const f of files){
    const text = await f.text();
    const rows = parseCSV(text.replace(/^﻿/,''));
    if(!rows.length) continue;
    let s;
    if(rows[0].includes('Entry ID')) s = parseDK(rows, f.name);
    else if(rows[0].includes('entry_id')) s = parseFD(rows, f.name);
    else { log(`Skipped ${f.name}: not a DK or FD entries file`); continue; }
    s.addedAt = Date.now(); s.file = f.name;
    if(slates[s.key]){ // merge contests from repeat uploads
      const old = slates[s.key]; const byId = Object.fromEntries(old.contests.map(c=>[c.id,c]));
      for(const c of s.contests) byId[c.id]=c; s.contests = Object.values(byId);
    }
    slates[s.key] = s;
    log(`Loaded ${f.name}: ${s.site} ${s.sport} ${s.type}, ${s.contests.reduce((n,c)=>n+c.entries,0)} entries, ${s.games.length} games`);
  }
  for(const s of Object.values(slates)) if(s.site=='FD') await resolveFD(s);
  save(); render(); changed();
  if(LS.get('autoSchedule', false)) scheduleAlerts(true);
}

// ---------- events ----------
// Distinguishing detail: matchups for small slates, else game count and time window
function slateDetail(s){
  const live = s.games.filter(x=>!x.started), done = s.games.length - live.length;
  const g = live.length, ts = live.map(x=>x.ms).filter(Boolean);
  const extra = done ? ' (started earlier)' : '';
  if(g<=2) return live.map(x=>x.label).join(', ') + extra;
  const lo = Math.min(...ts), hi = Math.max(...ts);
  const wd = t => new Date(t).toLocaleDateString('en-US',{timeZone:TZ,weekday:'short'})+' ';
  const md = ts.length && etDateKey(lo)!=etDateKey(hi);
  const f = t => (md?wd(t):'')+fmtTime(t);
  const win = ts.length ? (lo==hi ? fmtTime(lo) : `${f(lo)}–${f(hi)}`) : '';
  return `${g} games${win?' · '+win:''}${extra}`;
}
// DK lists finished games only as "Final"; borrow matchups from other loaded slates of the same sport
// that started within the 4 days before this slate's next game
function guessPlayed(s){
  const live = s.games.filter(g=>g.ms).map(g=>g.ms); if(!live.length) return '';
  const first = Math.min(...live), now = Date.now(), seen = new Set(s.games.map(g=>g.label));
  const found = new Set();
  for(const o of Object.values(slates)) if(o!==s && o.sport==s.sport) for(const g of o.games)
    if(g.ms && g.ms<now && g.ms<first && g.ms>first-4*86400e3 && !seen.has(g.label)) found.add(g.label);
  return found.size ? [...found].join(', ')+' <span class="muted small">(from your other slates)</span>' : '';
}
function slateName(s){ return `${s.site} ${s.sport} ${s.type} · ${slateDetail(s)}`; }
function slateEvents(s){
  const byT = {};
  for(const g of s.games) if(g.ms) (byT[g.ms] ||= []).push(g.label);
  const ts = Object.keys(byT).map(Number).sort((a,b)=>a-b);
  const started = s.games.some(g=>g.started);
  return ts.map((t,i)=>({t, games:byT[t], kind: (i==0 && !started) ? 'first' : (i==ts.length-1 ? 'last' : 'swap'), slate:s}));
}
function allEvents(){ return Object.values(slates).flatMap(slateEvents).sort((a,b)=>a.t-b.t); }
// within one time: by sport, then First Lock before Late Swap, then site
const kindRank = e => e.kind=='first' ? 0 : 1;
const bySportKind = (a,b) => a.slate.sport.localeCompare(b.slate.sport) || kindRank(a)-kindRank(b) || a.slate.site.localeCompare(b.slate.site);
const kindLabel = e => e.kind=='first' ? 'First Lock' : 'Late Swap';

// ---------- render ----------
function render(){
  prune();
  const el = document.getElementById('slates'); el.innerHTML='';
  const startKey = x => x.games.some(g=>g.started) ? 0 : (slateEvents(x)[0]?.t||0); // slates already underway first
  const list = Object.values(slates).sort((a,b)=>startKey(a)-startKey(b));
  const now = Date.now();
  for(const s of list){
    const ev = slateEvents(s); const nextT = ev.find(e=>e.t>now)?.t;
    const multiDay = new Set(ev.map(e=>etDateKey(e.t))).size > 1 || s.games.some(g=>g.started);
    const when = t => multiDay ? new Date(t).toLocaleDateString('en-US',{timeZone:TZ,weekday:'short'})+' '+fmtTime(t) : fmtTime(t);
    const d = document.createElement('div'); d.className='card';
    const entries = s.contests.reduce((n,c)=>n+c.entries,0);
    d.innerHTML = `<div class="slate-h"><div><span class="pill ${s.site}">${s.site=='DK'?'DraftKings':'FanDuel'}</span> <strong>${s.sport}</strong> <span class="pill type">${s.type}</span> <strong>${slateDetail(s)}</strong> <span class="muted small">${s.games.some(g=>g.started)?'Underway':(ev[0]?fmtDay(ev[0].t):'')} · ${entries} entries</span></div><button class="x" title="Remove">✕</button></div>`;
    const t = document.createElement('table');
    t.innerHTML = '<tr><th>Start</th><th>Games</th><th></th></tr>' + s.games.filter(g=>g.started).map(g=>`<tr class="past"><td class="t">Earlier</td><td>${g.teams?.length ? g.teams.join(', ')+` <span class="muted small">(${g.label.toLowerCase()})</span>` : (guessPlayed(s) || 'Game(s) already played')}</td><td class="tag">Locked</td></tr>`).join('') + ev.map(e=>`<tr class="${e.t<now?'past':''} ${e.t==nextT?'next':''}"><td class="t">${when(e.t)}</td><td>${e.games.join(', ')}</td><td class="tag ${e.kind}">${kindLabel(e)}</td></tr>`).join('');
    const missing = s.games.filter(g=>!g.ms && !g.started);
    for(const g of missing){
      const tr=document.createElement('tr');
      tr.innerHTML=`<td class="t"><input type="datetime-local" step="300" value="${s.date}T19:00"></td><td>${g.label} <span class="warn small">start time not found, enter it</span></td><td></td>`;
      tr.querySelector('input').onchange = ev2 => {
        const [dpart,tpart]=ev2.target.value.split('T'); if(!tpart) return;
        const [hh,mm]=tpart.split(':').map(Number); const [y,m,dd]=dpart.split('-').map(Number);
        manual[s.key+'|'+g.label] = g.ms = etToMs(y,m,dd,hh,mm); g.src='entered'; save(); render(); changed();
      };
      t.appendChild(tr);
    }
    d.appendChild(t);
    const det = document.createElement('details');
    det.innerHTML = `<summary>${s.contests.length} contest${s.contests.length==1?'':'s'}</summary><div class="small">${s.contests.map(c=>`${c.name} · ${c.fee} × ${c.entries}`).join('<br>')}</div>` +
      (s.site=='FD' ? `<div class="small muted" style="margin-top:4px">Times from: ${[...new Set(s.games.map(g=>g.src).filter(Boolean))].join(', ')||'none'}</div>`:'');
    d.appendChild(det);
    d.querySelector('.x').onclick = ()=>{ delete slates[s.key]; save(); render(); changed(); };
    el.appendChild(d);
  }
  // timeline
  const tl = document.getElementById('timeline'); const ev = allEvents().filter(e=>e.t > now - 6*3600e3);
  document.getElementById('timelineCard').hidden = !ev.length;
  const byT = {}; for(const e of ev) (byT[e.t] ||= []).push(e);
  for(const k in byT) byT[k].sort(bySportKind);
  const nextT = ev.find(e=>e.t>now)?.t;
  let lastDay = '';
  tl.innerHTML = Object.entries(byT).sort((a,b)=>a[0]-b[0]).map(([t,es])=>{
    const day = fmtDay(+t); const hdr = day!==lastDay ? `<tr><th colspan="2">${etDateKey(+t)==todayKey()?'Today, ':(etDateKey(+t)==etDateKey(Date.now()+864e5)?'Tomorrow, ':'')}${day}</th></tr>` : ''; lastDay = day;
    return hdr + `<tr class="${+t<now?'past':''} ${+t==nextT?'next':''}"><td class="t">${fmtTime(+t)}</td><td>${es.map(e=>`<span class="pill ${e.slate.site}">${e.slate.site}</span> ${e.slate.sport} ${e.slate.type} <span class="muted">${slateDetail(e.slate)}</span> <span class="tag ${e.kind}">${kindLabel(e)}</span>`).join('<br>')}</td></tr>`;
  }).join('');
  renderDay();
  tick();
}

// ---------- day view ----------
let view = LS.get('view','list'), dayKey = null;
function renderDay(){
  const isDay = view=='day';
  document.getElementById('timeline').hidden = isDay;
  const dv = document.getElementById('dayview'); dv.hidden = !isDay;
  document.getElementById('vList').classList.toggle('on', !isDay);
  document.getElementById('vDay').classList.toggle('on', isDay);
  if(!isDay) return;
  const now = Date.now();
  const all = allEvents();
  const days = [...new Set(all.map(e=>etDateKey(e.t)))].filter(d=>d>=todayKey() || all.some(e=>etDateKey(e.t)==d && e.t>now-6*3600e3)).sort();
  if(!days.length){ dv.innerHTML='<p class="muted">No locks to show.</p>'; return; }
  if(!days.includes(dayKey)) dayKey = days.includes(todayKey()) ? todayKey() : days[0];
  const di = days.indexOf(dayKey);
  const ev = all.filter(e=>etDateKey(e.t)==dayKey);
  // hour range for this day
  const [y,m,d] = dayKey.split('-').map(Number);
  const hourMs = h => etToMs(y,m,d,0,0) + h*3600e3;
  const hrs = ev.map(e=>(e.t-etToMs(y,m,d,0,0))/3600e3);
  let h0 = Math.floor(Math.min(...hrs)) - 1, h1 = Math.ceil(Math.max(...hrs)) + 1;
  if(dayKey==todayKey()){ const nh=(now-etToMs(y,m,d,0,0))/3600e3; if(nh>=h0-3 && nh<h0) h0=Math.floor(nh); }
  if(h1-h0 < 4) h1 = h0+4;
  h0=Math.max(0,h0); h1=Math.min(24,h1);
  const pct = t => ((t - hourMs(h0)) / (hourMs(h1)-hourMs(h0)) * 100);
  const step = (h1-h0) > 8 ? 2 : 1;
  let axis='', grid='';
  for(let h=h0; h<=h1; h++){
    const x = pct(hourMs(h));
    grid += `<div class="ggrid" style="left:${x}%"></div>`;
    if((h-h0)%step==0 && h<h1) axis += `<span style="left:${Math.max(4,x)}%">${((h+11)%12)+1}${h<12||h==24?'a':'p'}</span>`;
  }
  // rows: one per slate with events this day
  const bySlate = new Map();
  for(const e of ev){ if(!bySlate.has(e.slate)) bySlate.set(e.slate, []); bySlate.get(e.slate).push(e); }
  const rows = [...bySlate.entries()].sort((a,b)=> a[1][0].t-b[1][0].t || a[0].sport.localeCompare(b[0].sport));
  const nowLine = (now>hourMs(h0) && now<hourMs(h1)) ? `<div class="gnow" style="left:${pct(now)}%"></div>` : '';
  const body = rows.map(([s,es])=>{
    const startedBefore = slateEvents(s).some(e=>e.t<es[0].t) || s.games.some(g=>g.started);
    const lo = startedBefore ? 0 : pct(es[0].t), hi = pct(es[es.length-1].t);
    const ticks = es.map(e=>`<div class="gtick ${e.kind=='first'?'first':''} ${e.t<now?'past':''}" style="left:${pct(e.t)}%" title="${fmtTime(e.t)} ${kindLabel(e)}: ${e.games.join(', ')}"></div><span class="gtime" style="left:${Math.min(95,Math.max(5,pct(e.t)))}%">${fmtTime(e.t).replace(':00','').replace(' ','').toLowerCase()}</span>`).join('');
    return `<div class="grow"><div class="glabel" title="${s.site} ${s.sport} ${s.type} · ${slateDetail(s)}"><span class="pill ${s.site}">${s.site}</span> ${s.sport} ${s.type} <span class="muted">${slateDetail(s)}</span></div>
      <div class="gtrack">${grid}${nowLine}<div class="gbar ${s.site} ${startedBefore?'cont':''}" style="left:${lo}%;width:${Math.max(hi-lo,0.8)}%"></div>${ticks}</div></div>`;
  }).join('');
  const dayLabel = (dayKey==todayKey()?'Today, ':(dayKey==etDateKey(now+864e5)?'Tomorrow, ':'')) + fmtDay(hourMs(12));
  dv.innerHTML = `<div class="dnav"><button id="dPrev" ${di<=0?'disabled':''}>‹</button><strong>${dayLabel}</strong><button id="dNext" ${di>=days.length-1?'disabled':''}>›</button></div>
    <div class="gantt"><div class="gaxrow"><div></div><div class="gaxis">${axis}</div></div><div style="position:relative">${body}</div></div>
    <div class="legend"><span><i style="background:var(--warn)"></i>First Lock</span><span><i style="background:var(--ink)"></i>Late Swap</span></div>`;
  dv.querySelector('#dPrev').onclick = ()=>{ dayKey = days[di-1]; renderDay(); };
  dv.querySelector('#dNext').onclick = ()=>{ dayKey = days[di+1]; renderDay(); };
}
document.getElementById('vList').onclick = ()=>{ view='list'; LS.set('view',view); renderDay(); };
document.getElementById('vDay').onclick = ()=>{ view='day'; LS.set('view',view); renderDay(); };

function tick(){
  const n = allEvents().find(e=>e.t>Date.now());
  const c = document.getElementById('countdown');
  if(!n){ c.textContent=''; return; }
  const m = Math.round((n.t-Date.now())/60000);
  const dayPfx = etDateKey(n.t)==todayKey() ? '' : new Date(n.t).toLocaleDateString('en-US',{timeZone:TZ,weekday:'short'})+' ';
  c.textContent = `next lock ${dayPfx}${fmtTime(n.t)} (in ${m>=60?Math.floor(m/60)+'h '+(m%60)+'m':m+'m'})`;
}
setInterval(()=>{ render(); }, 60000);

// ---------- ntfy ----------
function log(msg){ const l=document.getElementById('log'); l.textContent = (msg+'\n'+l.textContent).slice(0,3000); document.getElementById('lastLog').textContent = msg; }
// ---------- sync between devices ----------
// Slates are shared through a second ntfy topic, "<your topic>-sync", which your phone app
// isn't subscribed to. Only schedule data goes there (no entry IDs or lineups), compressed.
// Last change wins. ntfy.sh keeps it for 12 hours, so each device re-posts it every 6 hours when opened.
const syncTopic = () => { const t=(document.getElementById('topic').value||LS.get('topic','')).trim(); return t ? t+'-sync' : ''; };
async function pack(obj){
  const bytes = await new Response(new Blob([JSON.stringify(obj)]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer();
  let bin=''; new Uint8Array(bytes).forEach(b=>bin+=String.fromCharCode(b)); return btoa(bin);
}
async function unpack(b64){
  const bin = Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
  return JSON.parse(await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text());
}
function slimSlates(){
  return Object.values(slates).map(x=>({key:x.key, site:x.site, sport:x.sport, type:x.type, date:x.date, slateId:x.slateId, addedAt:x.addedAt,
    games:x.games.map(g=>({label:g.label, away:g.away, home:g.home, ms:g.ms, src:g.src, started:g.started, teams:g.teams})),
    contests:x.contests.map(c=>({name:c.name, fee:c.fee, entries:c.entries, id:c.id}))}));
}
function syncStatus(msg, bad){ const el=document.getElementById('syncStatus'); el.textContent='Sync: '+msg; el.classList.toggle('warn', !!bad); }
const nowStr = () => fmtTime(Date.now());
async function pushSync(){
  const t = syncTopic(); if(!t) return;
  if(!LS.get('changedAt',0)) LS.set('changedAt', Date.now());
  try{
    const body = await pack({v:1, at:LS.get('changedAt',0), slates:slimSlates()});
    const r = await fetch(`https://ntfy.sh/${encodeURIComponent(t)}?priority=1`, {method:'POST', body});
    if(r.ok){ LS.set('pushedAt', Date.now()); { const n=Object.keys(slates).length; syncStatus(`shared ${n} slate${n==1?"":"s"} at ${nowStr()}.`); }; }
    else syncStatus(`sharing failed (ntfy ${r.status}).`, true);
  }catch(e){ syncStatus('sharing failed: '+e.message, true); }
}
function changed(){ LS.set('changedAt', Date.now()); pushSync(); }
async function pullSync(force){
  const t = syncTopic(); if(!t){ syncStatus('enter your ntfy topic to share slates between devices.'); return; }
  try{
    const txt = await (await fetch(`https://ntfy.sh/${encodeURIComponent(t)}/json?poll=1&since=24h`)).text();
    const msgs = txt.split('\n').filter(Boolean).map(l=>JSON.parse(l)).filter(m=>m.event=='message' && m.message);
    let best=null;
    for(const m of msgs){ try{ const d=await unpack(m.message); if(d.v==1 && (!best || d.at>best.at)) best=d; }catch(e){} }
    const local = LS.get('changedAt',0), haveLocal = Object.keys(slates).length>0;
    if(best && (best.at > local || (!haveLocal && best.slates.length))){
      slates = Object.fromEntries(best.slates.map(x=>[x.key,x])); LS.set('changedAt', best.at);
      save(); render(); syncStatus(`got ${best.slates.length} slate${best.slates.length==1?'':'s'} from your other device at ${nowStr()}.`);
      if(LS.get('autoSchedule', false)) scheduleAlerts(true);
    } else if(haveLocal && (force || Date.now()-LS.get('pushedAt',0) > 6*3600e3) && local >= (best?.at||0)) await pushSync();
    else syncStatus(best ? `up to date (checked ${nowStr()}).` : (haveLocal ? `up to date (checked ${nowStr()}).` : `nothing shared yet. Open the page on the device that has your slates.`));
  }catch(e){ syncStatus('check failed: '+e.message, true); }
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) pullSync(); });

async function ntfy(topic, title, body, atSec){
  const p = new URLSearchParams({title, tags:'lock', priority:'4'});
  if(atSec) p.set('at', String(atSec));
  const r = await fetch(`https://ntfy.sh/${encodeURIComponent(topic)}?${p}`, {method:'POST', body});
  if(!r.ok) throw new Error('ntfy '+r.status);
}
// ntfy.sh holds scheduled messages for at most 3 days, so alerts further out are
// scheduled later: the page tops them up each time it is opened or files are added.
const MAX_DELAY = 3*86400e3 - 30*60e3;
async function scheduleAlerts(auto){
  const topic = document.getElementById('topic').value.trim();
  const lead = Math.max(1, +document.getElementById('lead').value || 25);
  if(!topic){ if(!auto) log('Enter your ntfy topic first.'); return; }
  LS.set('topic', topic); LS.set('lead', lead); LS.set('autoSchedule', true);
  const sent = LS.get('sent', {});
  const now = Date.now();
  // one alert per time, sectioned by sport, First Locks before Late Swaps
  const byT = {}; for(const e of allEvents()) if(e.t>now) (byT[e.t] ||= []).push(e);
  let n=0, skipped=0, later=0;
  for(const [t,es] of Object.entries(byT)){
    es.sort(bySportKind);
    const kinds = [...new Set(es.map(kindLabel))];
    const kind = kinds.join(' + ');
    const id = topic+'|'+lead+'|'+t+'|grouped|'+es.map(e=>e.slate.key).sort().join(';');
    if(sent[id]){ skipped++; continue; }
    const sendAt = +t - lead*60e3;
    if(sendAt - now > MAX_DELAY){ later++; continue; }
    const title = `${kind} at ${fmtTime(+t)} ET`;
    const lines = []; let lastSport = '', lastKind = '';
    for(const e of es){
      if(e.slate.sport!==lastSport){ if(lines.length) lines.push(''); lines.push(e.slate.sport); lastSport=e.slate.sport; lastKind=''; }
      if(kindLabel(e)!==lastKind){ lines.push(' '+kindLabel(e)+':'); lastKind=kindLabel(e); }
      lines.push(`  • ${e.slate.site} ${e.slate.type} · ${slateDetail(e.slate)}` + (e.slate.games.length>2 ? ` (${e.games.join(', ')})` : ''));
    }
    const body = lines.join('\n');
    try{
      await ntfy(topic, title, body, sendAt > now + 15e3 ? Math.floor(sendAt/1000) : null);
      sent[id] = Date.now(); n++;
    }catch(err){ log('Failed to schedule '+title+': '+err.message); }
  }
  for(const [k,v] of Object.entries(sent)) if(v < now - 3*86400e3) delete sent[k];
  LS.set('sent', sent);
  if(auto && !n) return;
  log(`Scheduled ${n} alert${n==1?'':'s'} (${lead} min before each lock)${skipped?`, ${skipped} already scheduled`:''}.` +
      (later ? ` ${later} more ${later==1?'is':'are'} over 3 days out and will be scheduled when you open this page closer to then.` : ''));
}

// ---------- wiring ----------
const file = document.getElementById('file'), drop = document.body;
document.getElementById('addFiles').onclick = ()=>file.click();
const settings = document.getElementById('settings'), gear = document.getElementById('gear');
gear.onclick = ()=>{ settings.hidden = !settings.hidden; gear.classList.toggle('on', !settings.hidden); };
if(!LS.get('topic','')){ settings.hidden = false; gear.classList.add('on'); }
file.onchange = ()=>{ handleFiles([...file.files]); file.value=''; };
drop.ondragover = e=>{ e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = ()=>drop.classList.remove('over');
drop.ondrop = e=>{ e.preventDefault(); drop.classList.remove('over'); handleFiles([...e.dataTransfer.files]); };
document.getElementById('topic').value = LS.get('topic','');
document.getElementById('topic').onchange = e=>{ LS.set('topic', e.target.value.trim()); pullSync(); };
document.getElementById('lead').value = LS.get('lead',25);
document.getElementById('schedule').onclick = ()=>scheduleAlerts(false);
document.getElementById('test').onclick = async ()=>{
  const topic=document.getElementById('topic').value.trim(); if(!topic) return log('Enter your ntfy topic first.');
  LS.set('topic', topic);
  try{ await ntfy(topic,'Slate alerts connected','Test from your slate schedule page.'); log('Test sent.'); }catch(e){ log('Test failed: '+e.message); }
};
document.getElementById('syncNow').onclick = ()=>pullSync(true);
document.getElementById('clear').onclick = ()=>{ slates={}; save(); render(); changed(); };
render();
(async()=>{
  const todo = Object.values(slates).filter(x=>x.site=='FD' && x.games.some(g=>!g.ms && !g.started));
  for(const x of todo) await resolveFD(x);
  if(todo.length){ save(); render(); }
  await pullSync();
  if(LS.get('autoSchedule', false)) scheduleAlerts(true);
})();
